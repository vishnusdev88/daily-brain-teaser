name: Daily brain teaser

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (make the video, post nothing)"
        type: boolean
        default: false
      platforms:
        description: "Only these platforms: ig, fb, yt (comma separated). Empty = all that are set up"
        type: string
        default: ""
      yt_privacy:
        description: "YouTube privacy"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write

concurrency:
  group: daily-brain-teaser
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Make and publish today's video
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLATFORMS: ${{ inputs.platforms }}
          YT_PRIVACY: ${{ inputs.yt_privacy }}
        run: |
          ARGS="--no-comment --state-dir state"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$PLATFORMS" ]; then ARGS="$ARGS --platforms $PLATFORMS"; fi
          if [ -n "$YT_PRIVACY" ]; then ARGS="$ARGS --yt-privacy $YT_PRIVACY"; fi
          python publish_daily.py $ARGS

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Record today's posts" && git push)
